[project]
name = "agent2utau"
version = "0.1.0"
description = "One-shot DiffSinger cover pipeline driving local OpenUtau (Yousa voicebank)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "numpy>=2.1",
]

[project.scripts]
agent2utau = "agent2utau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent2utau"]

[tool.uv]
package = true
