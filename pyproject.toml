[project]
name = "agent2utau"
version = "0.1.0"
description = "Source observations and explicit Agent-designed singing functions for OpenUtau"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "onnxruntime>=1.20",
    "matplotlib>=3.9",
    "soundfile>=0.13",
    "librosa>=0.10",
    "audio-separator>=0.40",
    "faster-whisper>=1.1",
    "torchfcpe>=0.0.4",
    "torch>=2.2",
    "torchaudio>=2.2",
    "pypinyin>=0.51",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agent2utau = "agent2utau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent2utau"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".local-archive", "runs", "external", ".venv"]
