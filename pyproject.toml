[project]
name = "agent2utau"
version = "0.1.0"
description = "One-shot DiffSinger cover pipeline driving local OpenUtau (Yousa voicebank)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "numpy>=2.1",
    "soundfile>=0.13",
    "librosa>=0.10",
    "audio-separator>=0.40",
    "faster-whisper>=1.1",
    "torchfcpe>=0.0.4",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agent2utau = "agent2utau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent2utau"]

[tool.uv]
package = true
