name: CI

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (lightweight — heavy runtime deps are deferred imports)
        run: |
          pip install -e . --no-deps
          pip install pytest numpy soundfile pyyaml librosa scipy
      - name: Core regression suite
        run: pytest -q
