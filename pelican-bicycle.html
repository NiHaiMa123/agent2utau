<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4efe5;color:#234e50;font-family:Georgia,'Microsoft YaHei',serif}.poster{width:min(960px,100%);padding:34px 24px 22px}header{display:flex;align-items:center;justify-content:space-between;border-top:2px solid #234e50;padding-top:15px}h1{font-size:clamp(24px,5vw,42px);font-weight:normal;letter-spacing:.08em;margin:0}header span{font:11px/1.7 monospace;letter-spacing:.17em;text-align:right}svg{display:block;width:100%;height:auto;overflow:visible}.caption{display:flex;justify-content:space-between;border-top:1px solid #b3b9a7;padding-top:13px;font-size:12px;letter-spacing:.13em}.spokes{animation:spin 2.8s linear infinite;transform-box:fill-box;transform-origin:center}.bird{animation:bob 2.8s ease-in-out infinite}.cloud{animation:drift 8s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes drift{to{transform:translateX(-12px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="poster">
  <header><h1>慢慢骑，随风去。</h1><span>THE PELICAN CYCLING CLUB<br>EST. SOME SUNNY AFTERNOON</span></header>
  <svg viewBox="0 0 920 650" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">

    <desc id="desc">奶白色鹈鹕戴着红色小帽，长长的橙黄色嘴喙迎着风，悠闲骑过海边，车后放着一篮小鱼。</desc>
    <defs>
      <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#234e50" opacity=".055"/></pattern>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#efb555"/><stop offset="1" stop-color="#e58d51"/></linearGradient>
      <g id="wheel"><circle r="103" fill="#f4efe5" stroke="#294a48" stroke-width="11"/><circle r="92" fill="none" stroke="#c1c5b7" stroke-width="2"/><g class="spokes" stroke="#8caaa1" stroke-width="1.6"><path d="M0-91V91M-91 0H91M-64-64 64 64M-64 64 64-64M-35-84 35 84M-84-35 84 35M-84 35 84-35M-35 84 35-84"/></g><circle r="9" fill="#edb65c" stroke="#294a48" stroke-width="3"/></g>
    </defs>
    <rect x="0" y="0" width="920" height="650" fill="url(#paper)"/>
    <circle cx="707" cy="171" r="91" fill="#e8c876" opacity=".72"/>
    <g class="cloud" fill="none" stroke="#c4cabb" stroke-width="2" stroke-linecap="round"><path d="M100 151h101m-81 12h54M711 72h68m-51 13h89"/></g>
    <path d="M35 391Q170 346 310 382T578 378T885 365V528H35Z" fill="#d8e3d6"/>
    <path d="M35 437Q172 406 316 429T604 430T885 415" fill="none" stroke="#a7c1b8" stroke-width="2"/>
    <g fill="none" stroke="#8eaaa2" stroke-width="2" stroke-linecap="round"><path d="M742 398h42m20 0h25M77 427h40m-20-29h37M658 453h37"/></g>
    <ellipse cx="464" cy="559" rx="329" ry="17" fill="#294a48" opacity=".09"/>
    <path d="M62 560H858" stroke="#9ba99a" stroke-width="2" stroke-linecap="round"/>
    <g><use href="#wheel" x="272" y="451"/><use href="#wheel" x="670" y="451"/></g>
    <!-- The frame, fork, and rear rack. -->
    <g fill="none" stroke="#30746b" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <path d="M272 451 370 303 447 451H272L551 323 447 451M370 303 551 323M670 451 568 270"/>
      <path d="M551 323 568 270"/>
    </g>
    <path d="m272 451 175 0" stroke="#476660" stroke-width="3"/>
    <g fill="none" stroke="#294a48" stroke-width="6" stroke-linecap="round"><path d="M370 303 359 276M568 270l-12-34q-6-20 15-23h34"/><path d="M188 335h139l-55 116m-54-116-30 116" stroke-width="4"/></g>
    <path d="M331 274q28-14 62-1l-3 11h-56q-13-1-3-10" fill="#b96549" stroke="#294a48" stroke-width="4"/>
    <path d="M587 210h24" stroke="#b96549" stroke-width="11" stroke-linecap="round"/>
    <!-- A basket of provisions. -->
    <g stroke="#846b44" stroke-width="3" stroke-linejoin="round">
      <path d="M173 282h133l-13 51H184Z" fill="#d2b47a"/>
      <path d="M193 285q-9-45 45-45t47 45" fill="none"/>
      <path d="m195 288 6 39m18-39 3 39m20-39v39m21-39-3 39m23-39-6 39M180 302h119m-116 15h112" fill="none" opacity=".6"/>
    </g>
    <g fill="#94b7ad" stroke="#294a48" stroke-width="2.5" stroke-linejoin="round"><path d="M207 280q28-41 61-11l17-10-1 23-18-6q-33 19-59 4Z"/><path d="M224 275q-4-34 20-46l12-20 7 22q20 29-11 49Z"/></g>
    <circle cx="217" cy="276" r="2.5" fill="#294a48"/><circle cx="241" cy="240" r="2.5" fill="#294a48"/>
    <!-- Far leg and pedal. -->
    <path d="m411 303 67 46-52 60" fill="none" stroke="#c98e41" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m428 404-18 15 37 2" fill="#e6ae4e" stroke="#294a48" stroke-width="3" stroke-linejoin="round"/>
    <path d="m447 451-29-38m-13 3h34" stroke="#294a48" stroke-width="5" stroke-linecap="round"/>
    <g class="bird" stroke="#294a48" stroke-linejoin="round" stroke-linecap="round">
      <!-- Tail, body and the unmistakably long pelican neck. -->
      <path d="m340 267-64-37 25 55-38-6q36 54 90 46" fill="#ece9d9" stroke-width="4"/>
      <path d="M339 301q-47-66 3-118 34-34 86-13 26 10 36 33l-1-79q-2-45 34-55 44-12 62 22 12 24-6 45l-32 39 1 83q-1 52-48 65-78 24-135-22Z" fill="#fffaf0" stroke-width="4"/>
      <path d="M472 163q-6 31 7 67t-4 69" fill="none" stroke="#d9dfd3" stroke-width="16"/>
      <!-- The folded wing reaches the handlebar. -->
      <path d="M354 214q30-20 57 11l50 47q13 9 39-6l65-36q17-8 23 4-31 41-79 63-39 17-62 4l-72-31" fill="#e3e6da" stroke-width="4"/>
      <path d="m366 236 51 39m-58-23 40 29" fill="none" stroke="#a1b5a9" stroke-width="3"/>
      <!-- The orange throat pouch and beak. -->
      <path d="M537 119 735 123q-55 22-113 53-54 21-85-19l-16-14Z" fill="url(#pouch)" stroke-width="4"/>
      <path d="m542 111 204 8q16 1 23 9l-225 8q-19-8-2-25Z" fill="#edbb53" stroke-width="4"/>
      <path d="m555 125 184-1" fill="none" stroke="#ac713c" stroke-width="2"/>
      <path d="M534 103q11-7 20 1" fill="none" stroke-width="3"/>
      <circle cx="539" cy="105" r="4" fill="#294a48" stroke="none"/>
      <circle cx="540" cy="104" r="1" fill="#fffaf0" stroke="none"/>
      <!-- Cap and fluttering scarf. -->
      <path d="M481 77q1-30 29-31 29-1 42 27Z" fill="#c8664a" stroke-width="4"/>
      <path d="m477 77 91-2q8 0 6 6l-91 5Z" fill="#ad533f" stroke-width="3"/>
      <path d="m484 190 36 5-3 17-34-6Z" fill="#cb6b4c" stroke-width="3"/>
      <path d="M486 199q-45-9-70-45l-2 24-29-3q44 41 101 36" fill="#cb6b4c" stroke-width="3"/>
    </g>
    <!-- Near leg and webbed foot. -->
    <path d="m385 313 28 54 61 68" fill="none" stroke="#294a48" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m385 313 28 54 61 68" fill="none" stroke="#e4ab49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m473 430 24 10 16 15-51-4Z" fill="#e7ae4c" stroke="#294a48" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="447" cy="451" r="19" fill="#f4efe5" stroke="#294a48" stroke-width="5"/>
    <circle cx="447" cy="451" r="5" fill="#294a48"/>
    <path d="m447 451 42-5m-5 7 31-3" stroke="#294a48" stroke-width="5" stroke-linecap="round"/>
    <g fill="none" stroke="#7e9d92" stroke-width="3" stroke-linecap="round"><path d="M126 207h56m-75 17h53m-26 19h37M793 337l13-8m-8 26h23"/></g>
    <g fill="#c8664a"><path d="m99 555-6-20q18 2 20 20Z"/><path d="m817 555 5-28q-20 9-17 28Z"/></g>
    <text x="460" y="610" text-anchor="middle" fill="#54766a" font-family="Georgia,serif" font-size="14" font-style="italic" letter-spacing="2">A little balance. A little breeze. A basket full of fish.</text>
  </svg>
  <div class="caption"><span>海风 · 两轮 · 一篮小鱼</span><span>NO. 001 / 悠闲出行</span></div>
</main>
</body>
</html>
